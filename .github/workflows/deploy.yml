name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx opennextjs-cloudflare build

      - name: Deploy Frontend to Cloudflare Pages
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CREEM_API_KEY: ${{ secrets.CREEM_API_KEY }}
          CREEM_WEBHOOK_SECRET: ${{ secrets.CREEM_WEBHOOK_SECRET }}
          CREEM_TEST_MODE: ${{ secrets.CREEM_TEST_MODE }}
          CREEM_STARTER_MONTHLY_PRODUCT_ID: ${{ secrets.CREEM_STARTER_MONTHLY_PRODUCT_ID }}
          CREEM_STARTER_YEARLY_PRODUCT_ID: ${{ secrets.CREEM_STARTER_YEARLY_PRODUCT_ID }}
          CREEM_PRO_MONTHLY_PRODUCT_ID: ${{ secrets.CREEM_PRO_MONTHLY_PRODUCT_ID }}
          CREEM_PRO_YEARLY_PRODUCT_ID: ${{ secrets.CREEM_PRO_YEARLY_PRODUCT_ID }}
          CREEM_CREDIT_MINI_PRODUCT_ID: ${{ secrets.CREEM_CREDIT_MINI_PRODUCT_ID }}
          CREEM_CREDIT_STANDARD_PRODUCT_ID: ${{ secrets.CREEM_CREDIT_STANDARD_PRODUCT_ID }}
          CREEM_CREDIT_LARGER_PRODUCT_ID: ${{ secrets.CREEM_CREDIT_LARGER_PRODUCT_ID }}
